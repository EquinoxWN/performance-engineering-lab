[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-engineering-lab"
version = "0.1.0"
description = "Why two functions with the same Big-O differ 10x in practice: cache lines, branch prediction and allocation, measured not guessed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# pyperf runs the CPython benchmarks; psutil pins the runner (and so every harness) to chosen CPUs.
dependencies = ["pyperf>=2.10,<3", "psutil>=7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "types-psutil>=7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test temp folders stay inside the repository.
addopts = "--basetemp=../.tmp/pytest"
# A runaway benchmark fails the test instead of hanging the run.
timeout = 300

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyperf ships no type hints; it is used only through an Any-typed Runner in bench.py.
module = ["pyperf"]
ignore_missing_imports = true
