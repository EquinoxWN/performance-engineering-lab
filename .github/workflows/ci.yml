name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install, lint and test
        run: make setup lint test
      # Shared runners are too noisy to judge hypotheses; this proves every harness runs every cell
      # and that the report finds results for every hypothesis. Verdicts come from local full runs.
      - name: Every experiment through JMH, pyperf and mitata (smoke profile)
        run: |
          set -o pipefail
          make bench-smoke | tee bench.txt || { echo "::error title=bench-smoke::$(grep '^RESULT' bench.txt || echo 'harness failed')"; exit 1; }
          echo "::notice title=bench-smoke (1 fork per cell, not judged)::$(grep '^RESULT' bench.txt)"
          cat .tmp/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Known-vulnerability audit (pip-audit, npm audit, OSV.dev for Maven)
        run: |
          set -o pipefail
          make audit | tee audit.txt || { echo "::error title=audit::$(tail -n 1 audit.txt)"; exit 1; }
          echo "::notice title=audit::$(tail -n 1 audit.txt)"
